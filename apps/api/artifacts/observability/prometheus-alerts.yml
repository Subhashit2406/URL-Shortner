groups:
  - name: notification-service-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Error rate exceeds 5%"
          description: "Service notification-service error rate is above 5% over 5m."
          runbook: "https://wiki.example.com/runbooks/high-error-rate"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency exceeds 2 seconds"
          description: "p95 latency exceeds 2s over 5m."
          runbook: "https://wiki.example.com/runbooks/high-latency"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "Prometheus scraper cannot reach /metrics for over 1m."
          runbook: "https://wiki.example.com/runbooks/service-down"
